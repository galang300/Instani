services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: panganterkini
      POSTGRES_USER: pangan
      POSTGRES_PASSWORD: pangan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pangan -d panganterkini"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: sh -c "npx prisma db push --schema services/api/prisma/schema.prisma --accept-data-loss && npm --workspace @panganterkini/api run start"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://pangan:pangan@postgres:5432/panganterkini?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      SCRAPER_URL: http://scraper:5000
    ports:
      - "4000:4000"
    volumes:
      - ./services/api/data:/app/services/api/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      scraper:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_REALTIME_URL: http://localhost:4001
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_REALTIME_URL: http://localhost:4001
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "3001:3001"
    depends_on:
      - api

  scraper:
    build: ./services/scraper
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    environment:
      REALTIME_PORT: 4001
      REDIS_URL: redis://redis:6379
      API_URL: http://api:4000
    ports:
      - "4001:4001"
    depends_on:
      - redis
      - api

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
      - minio

  ml-anomaly:
    build: ./services/ml-anomaly
    environment:
      ML_ANOMALY_PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - realtime

volumes:
  postgres_data:
  minio_data:
